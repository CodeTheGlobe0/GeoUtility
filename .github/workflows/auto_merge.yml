name: Auto Merge Subhajit to Main

on:
  push:
    branches:
      - subhajit

permissions:
  contents: write  # Grant write permission to push the merge back to the repository

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to allow successful merging

      - name: Configure Git Bot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge subhajit into main
        run: |
          git checkout main
          git merge origin/subhajit --no-ff -m "Auto-merge branch 'subhajit' into main [skip ci]"
          git push origin main
