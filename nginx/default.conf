# Config for the `nginx` container: the single entry point on 3006.
# Routes between the SPA (frontend container) and Django (backend container).

server {
    listen 3006;
    server_name _;

    # GIS archives (zipped shapefiles, GeoPackages) can be large.
    client_max_body_size 500M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # $http_host keeps the port (localhost:3006), so Django's CSRF origin
    # check matches for the admin.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Resolve service names at request time, so nginx still starts when a
    # container is down (502 instead of a boot failure).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend  http://backend:8006;
    set $frontend http://frontend:80;

    # Django's own routes already start with /api/, so the prefix is kept.
    location /api/ {
        proxy_pass $backend;
    }

    location /admin/ {
        proxy_pass $backend;
    }

    # gunicorn does not serve static files; nginx serves the shared volume.
    # (the backend container runs collectstatic on start)
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
    }

    location /media/ {
        alias /app/media/;
        access_log off;
    }

    # The SPA. Keep last so it only catches what is left.
    location / {
        proxy_pass $frontend;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
